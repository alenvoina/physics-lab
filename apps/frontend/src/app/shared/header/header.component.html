<mat-toolbar class="header" [class.dark-theme]="darkTheme">
  <div class="left">
    <div class="logo" routerLink="/">
      <mat-icon class="logo-icon">science</mat-icon>
      <span class="logo-text">Physics Lab</span>
    </div>
  </div>

  <div class="center desktop-nav">
    <nav class="nav">
      <button mat-button routerLink="/simulations">Симуляции</button>
      <button mat-button routerLink="/experiments">Галерея</button>
      <button mat-button routerLink="/articles">Журнал</button>
      <button mat-button routerLink="/news">Новости</button>
    </nav>
  </div>

  <div class="right">
    <div class="auth desktop-auth">
      <button
        mat-stroked-button
        color="accent"
        class="btn-login"
        (click)="openLoginModal()"
      >
        Войти
      </button>
      <button mat-button class="btn-register" (click)="openLoginModal()">
        Регистрация
      </button>
    </div>

    <button
      mat-icon-button
      class="burger"
      (click)="toggleMenu()"
      [class.active]="menuOpen"
    >
      <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

<div
  class="mobile-menu-overlay"
  [class.is-open]="menuOpen"
  [class.dark-theme]="darkTheme"
>
  <div class="mobile-menu-content">
    <nav class="mobile-nav">
      <a class="nav-link" routerLink="/simulations" (click)="closeMenu()">
        <span class="link-text">Симуляции</span>
        <mat-icon>chevron_right</mat-icon>
      </a>
      <a class="nav-link" routerLink="/experiments" (click)="closeMenu()">
        <span class="link-text">Галерея</span>
        <mat-icon>chevron_right</mat-icon>
      </a>
      <a class="nav-link" routerLink="/articles" (click)="closeMenu()">
        <span class="link-text">Журнал</span>
        <mat-icon>chevron_right</mat-icon>
      </a>
      <a class="nav-link" routerLink="/news" (click)="closeMenu()">
        <span class="link-text">Новости</span>
        <mat-icon>chevron_right</mat-icon>
      </a>
    </nav>

    <div class="mobile-auth-wrapper">
      <div class="divider"></div>
      <button
        mat-flat-button
        color="accent"
        class="btn-mobile-login"
        (click)="openLoginModal()"
      >
        Войти в аккаунт
      </button>
      <button mat-button class="btn-mobile-register" (click)="openLoginModal()">
        Создать профиль
      </button>
    </div>
  </div>
</div>

<ng-template #loginModal>
  <h2 mat-dialog-title>Coming Soon 🚀</h2>
  <mat-dialog-content>
    The Login feature is under construction.
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</ng-template>
