<mat-toolbar class="header" [class.dark-theme]="darkTheme">

  <div class="left">
    <div class="logo" routerLink="/">
      <mat-icon>science</mat-icon>
      <span>Physics Lab</span>
    </div>
  </div>

  <div class="center">
    <nav class="nav">
      <button mat-button routerLink="/simulations">Simulations</button>
      <button mat-button routerLink="/quantum-system">Theory</button>
      <button mat-button routerLink="/news">News</button>
    </nav>
  </div>

  <div class="right">
    <button mat-raised-button filled class="button-black" color="accent" (click)="openLoginModal()">Login</button>
    <button matButton class="button-black" color="accent" (click)="openLoginModal()">Sign in</button>
  </div>
</mat-toolbar>

<ng-template #loginModal>
  <h2 mat-dialog-title>Coming Soon 🚀</h2>
  <mat-dialog-content>
    The Login feature is under construction.
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</ng-template>
