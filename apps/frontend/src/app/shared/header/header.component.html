<mat-toolbar class="header" [class.dark-theme]="darkTheme">
  <div class="left">
    <div class="logo" routerLink="/">
      <mat-icon>science</mat-icon>
      <span>Physics Lab</span>
    </div>
  </div>

  <div class="center desktop-nav">
    <nav class="nav">
      <button mat-button routerLink="/simulations">Симуляции</button>
      <button mat-button routerLink="/experiments">Галерея</button>
      <button mat-button routerLink="/articles">Журнал</button>
      <button mat-button routerLink="/news">Новости</button>
    </nav>
  </div>

  <div class="right">
    <button mat-icon-button class="burger" (click)="toggleMenu()">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="auth desktop-auth">
      <button mat-stroked-button color="accent" (click)="openLoginModal()">
        Войти
      </button>
      <button mat-button (click)="openLoginModal()">Зарегистрироваться</button>
    </div>
  </div>
</mat-toolbar>

<div class="mobile-menu" *ngIf="menuOpen">
  <button mat-button routerLink="/simulations" (click)="closeMenu()">
    Симуляции
  </button>
  <button mat-button routerLink="/experiments" (click)="closeMenu()">
    Галерея
  </button>
  <button mat-button routerLink="/physics-life" (click)="closeMenu()">
    Физика
  </button>
  <button mat-button routerLink="/news" (click)="closeMenu()">Новости</button>

  <div class="mobile-auth">
    <button mat-stroked-button color="accent" (click)="openLoginModal()">
      Войти
    </button>
    <button mat-button (click)="openLoginModal()">Зарегистрироваться</button>
  </div>
</div>

<ng-template #loginModal>
  <h2 mat-dialog-title>Coming Soon 🚀</h2>
  <mat-dialog-content>
    The Login feature is under construction.
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</ng-template>
