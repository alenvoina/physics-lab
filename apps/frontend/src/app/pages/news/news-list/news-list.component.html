<section class="premium-news-section">
  <div class="news-grid">
    <article class="news-card" *ngFor="let news of newsList">
      <div class="card-image-wrapper">
        <img
          [src]="news.image"
          [alt]="news.title"
          class="news-image"
          loading="lazy"
        />
      </div>

      <div class="card-content">
        <h3 class="card-title">{{ news.title }}</h3>
        <div class="card-summary" [innerHTML]="news.summary"></div>
      </div>

      <div class="card-footer">
        <button
          mat-button
          class="premium-button"
          [routerLink]="['/news', news.id]"
        >
          Read More <span class="arrow">→</span>
        </button>
      </div>
    </article>
  </div>
</section>
