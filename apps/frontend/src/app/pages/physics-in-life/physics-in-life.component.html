<div class="life-container">
  <div class="content-wrapper">
    <header class="header">
      <span class="badge">Наука в действии</span>
      <h1>Физика в жизни</h1>
      <p class="subtitle">
        Как фундаментальные законы вселенной определяют комфорт и возможности
        современного мира
      </p>
    </header>

    <div class="grid">
      <div
        class="card"
        *ngFor="let item of items; let i = index"
        (click)="open(item)"
      >
        <div class="icon-box">
          <mat-icon>{{ item.icon }}</mat-icon>
        </div>
        <div class="card-body">
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
        <div class="card-footer">
          <span>Подробнее</span>
          <mat-icon>chevron_right</mat-icon>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="selected" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="modal-header">
      <div class="modal-icon">
        <mat-icon>{{ selected.icon }}</mat-icon>
      </div>
      <h2>{{ selected.title }}</h2>
    </div>

    <div class="modal-content">
      <p>{{ selected.details }}</p>
    </div>

    <button class="action-btn" (click)="close()">Закрыть</button>
  </div>
</div>
