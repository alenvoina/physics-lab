<div class="gallery">
  <h1>Галерея экспериментов</h1>
<input type="text" placeholder="Поиск..." [(ngModel)]="query" />
  <div class="grid">
    <div class="card" *ngFor="let exp of filtered" (click)="open(exp)">
      <img [src]="exp.image" alt="" />

      <div class="overlay">
        <h3>{{ exp.title }}</h3>
        <p>{{ exp.short }}</p>
      </div>
    </div>
  </div>
</div>

<div class="modal" *ngIf="selected" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>{{ selected.title }}</h2>
    <p>{{ selected.full }}</p>
    <button mat-raised-button color="accent" (click)="close()">Закрыть</button>
  </div>
</div>
