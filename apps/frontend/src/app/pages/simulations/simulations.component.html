<div class="simulations-page">
  <div class="bg-glow"></div>

  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <div class="hero-text">
          <span class="badge">Интерактивная среда</span>
          <h1>
            Добро пожаловать в <span class="gradient-text">Physics Lab</span>
          </h1>
          <p>
            Погрузитесь в мир физики через высокоточные симуляции: от
            классической механики до квантовых явлений.
          </p>
          <div class="hero-actions">
            <button class="primary-btn">Начать обучение</button>
            <button class="secondary-btn">Посмотреть демо</button>
          </div>
        </div>
        <div class="hero-visual">
          <div class="orbit">
            <div class="electron"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="container main-content">
    <section
      class="simulation-category"
      *ngFor="let category of simulationCategories"
      [id]="category.id"
    >
      <div class="category-header">
        <div class="title-wrapper">
          <div
            class="category-dot"
            [style.background-color]="category.color"
          ></div>
          <h2>{{ category.title }}</h2>
        </div>
        <div class="category-line"></div>
      </div>

      <div class="cards-grid">
        <div
          class="premium-card"
          *ngFor="let sim of category.simulations"
          [style.--accent]="category.color"
        >
          <div class="card-inner">
            <div class="card-top">
              <div class="icon-wrapper">
                <mat-icon>science</mat-icon>
              </div>
              <span class="sim-tag">Simulation</span>
            </div>

            <h3>{{ sim.title }}</h3>
            <p class="description">{{ sim.description }}</p>

            <ul class="feature-list">
              <li *ngFor="let point of sim.points">
                <mat-icon class="check">done</mat-icon>
                <span>{{ point }}</span>
              </li>
            </ul>

            <button class="start-sim-btn" [routerLink]="sim.link">
              <span>Запустить симуляцию</span>
              <mat-icon>arrow_forward</mat-icon>
            </button>
          </div>
          <div class="card-bg-shape"></div>
        </div>
      </div>
    </section>
  </div>
</div>
