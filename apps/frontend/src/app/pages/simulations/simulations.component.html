<div class="simulations-page">

  <section class="hero">
    <div class="hero-text">
      <h1>Добро пожаловать в Physics Lab Simulations</h1>
      <p>Погрузитесь в мир физики: механика, квантовые эффекты и ядерные реакции — через интерактивные симуляции!</p>
    </div>
    <div class="hero-animation">
    </div>
  </section>

  <section class="simulation-category" *ngFor="let category of simulationCategories">
    <h2>{{ category.title }}</h2>
    <div class="cards-container">
      <mat-card class="sim-card" *ngFor="let sim of category.simulations" [ngStyle]="{'border-top': '5px solid ' + category.color}">
        <mat-card-header>
          <mat-card-title>{{ sim.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ sim.description }}</p>
          <ul>
            <li *ngFor="let point of sim.points">{{ point }}</li>
          </ul>
        </mat-card-content>
        <mat-card-actions>
          <button mat-raised-button color="primary" [routerLink]="sim.link">Start Simulation</button>
        </mat-card-actions>
      </mat-card>
    </div>
  </section>

</div>
