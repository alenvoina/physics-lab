<div class="facts">
  <h1>Физические факты</h1>

  <!-- ФИЛЬТРЫ -->
  <div class="filters">
    <button 
      *ngFor="let cat of categories"
      [class.active]="cat === selectedCategory"
      (click)="selectCategory(cat)">
      {{ cat }}
    </button>
  </div>

  <!-- КАРТОЧКИ -->
  <div class="grid">
    <div class="card" *ngFor="let fact of filteredFacts">
      <span class="category">{{ fact.category }}</span>
      <h3>{{ fact.title }}</h3>
      <p>{{ fact.description }}</p>
    </div>
  </div>
</div>
