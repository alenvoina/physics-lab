<div class="sim-root light-theme">
  <header class="sim-header">
    <div class="title">
      <mat-icon>science</mat-icon>
      <span class="desktop-only">Lab:</span> <span>Pendulum Pro</span>
    </div>
    <div class="mode-switcher">
      <button [class.active]="mode === 'earth'" (click)="setMode('earth')">🌍 Земля</button>
      <button [class.active]="mode === 'moon'" (click)="setMode('moon')">🌙 Луна</button>
    </div>
  </header>

  <main class="main-layout">
    <section class="viewport-container">
      <canvas #canvas></canvas>
      
      <div class="hud-metrics">
        <div class="metric-card">
          <span class="label">Амплитуда</span>
          <span class="value">{{ amplitude | number:'1.1-1' }}°</span>
        </div>
        <div class="metric-card highlight">
          <span class="label">Энергия</span>
          <span class="value">{{ energy | number:'1.2-2' }} Дж</span>
        </div>
      </div>
    </section>

    <section class="dashboard">
      <div class="dashboard-card graph-area">
        <div class="card-header">
          <h3>Динамика энергии</h3>
          <div class="legend">
            <div class="legend-item kin"><span class="dot"></span> Кинет.</div>
            <div class="legend-item pot"><span class="dot"></span> Потенц.</div>
          </div>
        </div>
        <div class="canvas-wrapper" #graphWrapper>
          <canvas #graphCanvas></canvas>
        </div>
      </div>

      <div class="dashboard-card settings-area">
        <h3>Параметры</h3>
        <div class="control-group">
          <div class="label-row">
            <span>Длина нити</span>
            <span class="accent">{{ length }} см</span>
          </div>
          <input type="range" min="100" max="400" [(ngModel)]="length" (input)="updateLength()" />
        </div>

        <div class="control-group">
          <div class="label-row">
            <span>Темп времени</span>
            <span class="accent">{{ timeScale.toFixed(1) }}x</span>
          </div>
          <input type="range" min="0.1" max="2" step="0.1" [(ngModel)]="timeScale" />
        </div>

        <button class="btn-reset" (click)="reset()">Сброс</button>
      </div>
    </section>
  </main>
</div>
