  <header class="sim-header">
    <div class="title">
      <span>Orbital Simulation</span>
    </div>
  </header>

<canvas #canvas class="canvas"></canvas>

<div class="panel">
  <div class="title">Pendulum Lab</div>

  <div class="row">Amplitude: {{ amplitude | number:'1.0-1' }}°</div>
  <div class="row">Period: {{ period | number:'1.00-2' }}</div>
  <div class="row">Energy: {{ energy | number:'1.00-2' }}</div>

  <div class="row">
    Length: {{ length }}
    <input type="range" min="100" max="400" [(ngModel)]="length" (input)="updateLength()" />
  </div>

  <div class="row">
    Speed: {{ timeScale.toFixed(1) }}
    <input type="range" min="0.2" max="3" step="0.1" [(ngModel)]="timeScale" />
  </div>

  <div class="buttons">
    <button (click)="setMode('earth')">🌍 Earth</button>
    <button (click)="setMode('moon')">🌙 Moon</button>
    <button (click)="reset()">Reset</button>
  </div>
</div>
